services:

  # ─────────────────────────────────────────────
  # PostgreSQL — isolated production instance
  # ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_NAME:-memobrain}
      POSTGRES_USER:     ${DB_USER:-memobrain}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - memobrain_prod_db:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-memobrain} -d ${DB_NAME:-memobrain}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - internal
    # Port intentionally NOT exposed to host — only reachable by backend container

  # ─────────────────────────────────────────────
  # Backend — Node.js / Express API
  # ─────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV:       production
      PORT:           3001
      DB_HOST:        postgres
      DB_PORT:        5432
      DB_NAME:        ${DB_NAME:-memobrain}
      DB_USER:        ${DB_USER:-memobrain}
      DB_PASSWORD:    ${DB_PASSWORD}
      JWT_SECRET:     ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      CORS_ORIGIN:    ${CORS_ORIGIN:-http://localhost:8091}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - internal

  # ─────────────────────────────────────────────
  # Frontend — Nginx serving the Vite build
  # Proxies /api/* → backend:3001
  # ─────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8091}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - internal

# ─────────────────────────────────────────────
# Volumes & Networks
# ─────────────────────────────────────────────
volumes:
  memobrain_prod_db:       # distinct name — never conflicts with dev
    driver: local

networks:
  internal:
    driver: bridge
